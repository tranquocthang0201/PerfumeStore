name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t perfume-store-backend:test ./backend

      - name: Build frontend image
        run: docker build -t perfume-store-frontend:test ./frontend

      - name: Validate Compose file
        run: docker compose config
        env:
          JWT_SECRET: ci-only-long-random-secret
          MSSQL_SA_PASSWORD: CiOnly_StrongPassw0rd!
          ADMIN_PASSWORD: CiOnly_AdminPassw0rd!
